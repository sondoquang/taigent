# Publishes taigent to npm when a release tag v<version> is pushed (docs/cli.md §Releasing).
# Authenticates with npm trusted publishing (OIDC), or with the NPM_TOKEN secret when one is set.
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC: trusted publishing and the provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Tag matches the package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi
      - name: npm 11.5.1 or later (trusted publishing)
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
