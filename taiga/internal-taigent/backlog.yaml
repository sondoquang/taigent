# Spec: https://github.com/sondoquang/taigent/issues/1
# Mỗi epic là một nhóm user story của spec; số US ở comment là số thứ tự user story trong spec.
epics:
  - key: SETUP
    subject: "Thiết lập và bảo mật"
    description: "Clone repo, đặt biến môi trường cá nhân là dùng được; mật khẩu và token không bao giờ vào git hay output. Spec: https://github.com/sondoquang/taigent/issues/1"
    tags: [type:chore]
    stories:
      # US1, US3
      - key: SETUP-ENV
        subject: "Cấu hình credentials qua biến môi trường"
        description: "Là thành viên team, tôi muốn clone repo, đặt TAIGA_API_URL/TAIGA_USERNAME/TAIGA_PASSWORD trong biến môi trường cá nhân là dùng được ngay, để không phải sửa file cấu hình nào."
        acceptance_criteria:
          - "File env mẫu liệt kê đủ các biến TAIGA_* cần đặt và không chứa giá trị thật."
          - "Đặt các biến trong môi trường cá nhân thì cả MCP lẫn CLI taigent nối được Taiga mà không sửa file nào trong repo."
          - "AGENTS.md hướng dẫn đặt biến trên PowerShell và POSIX shell."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:chore]
      # US2, US5, US6
      - key: SETUP-MCP-CONFIG
        subject: "Cấu hình MCP không chứa bí mật cho Claude Code và Codex"
        description: "Là thành viên team, tôi muốn cấu hình MCP được commit chỉ chứa placeholder và phiên bản server ghim cố định, để mật khẩu không vào git và mọi máy chạy cùng một bản."
        acceptance_criteria:
          - "Cấu hình MCP của Claude Code chỉ chứa placeholder ${TAIGA_*}, không có giá trị literal."
          - "Cấu hình MCP project của Codex chuyển tiếp biến bằng env_vars với required = true, không có giá trị literal."
          - "Cả hai cấu hình ghim taiga-mcp-server@1.9.20."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:chore]
        tasks:
          - key: SETUP-MCP-CONFIG-CLAUDE
            subject: "Cấu hình .mcp.json cho Claude Code"
            description: "Done khi: .mcp.json chỉ dùng ${TAIGA_*}, ghim taiga-mcp-server@1.9.20 và claude mcp list thấy server taiga kết nối được."
          - key: SETUP-MCP-CONFIG-CODEX
            subject: "Cấu hình .codex/config.toml cho Codex"
            description: "Done khi: .codex/config.toml dùng env_vars với required = true, ghim taiga-mcp-server@1.9.20 và Codex gọi được tool đọc của Taiga MCP."
      # US4
      - key: SETUP-GITIGNORE
        subject: "Chặn bí mật bằng .gitignore"
        description: "Là thành viên team, tôi muốn repo có .gitignore chặn file env, cấu hình agent cá nhân và state tạm, để không commit nhầm bí mật."
        acceptance_criteria:
          - "File env, cấu hình agent cá nhân và state tạm không xuất hiện trong git status sau khi tạo."
          - "File env mẫu vẫn được commit."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:chore]
      # US7
      - key: SETUP-TOKEN
        subject: "Hỗ trợ TAIGA_TOKEN thay cho mật khẩu"
        description: "Là thành viên team, tôi muốn CLI hỗ trợ TAIGA_TOKEN thay cho mật khẩu, để sau này chuyển sang token mà không phải đổi quy trình."
        acceptance_criteria:
          - "Có TAIGA_TOKEN thì CLI gửi token đó và không cần TAIGA_PASSWORD."
          - "Không có TAIGA_TOKEN thì CLI đăng nhập bằng TAIGA_USERNAME/TAIGA_PASSWORD như trước."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:feature]
      # US8
      - key: SETUP-REDACT
        subject: "Không lộ mật khẩu và token trong output"
        description: "Là thành viên team, tôi muốn CLI không bao giờ in mật khẩu hay token ra stdout, stderr hoặc log, kể cả khi lỗi, để output của agent không làm lộ bí mật."
        acceptance_criteria:
          - "Stdout, stderr và output JSON của mọi lệnh không chứa mật khẩu hay token, kể cả khi đăng nhập thất bại hoặc Taiga trả lỗi."
          - "TAIGA_API_URL chứa credentials thì CLI từ chối với exit 2 và không in giá trị đó."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:feature]
      # US9
      - key: SETUP-ERRORS
        subject: "Báo lỗi cấu hình và đăng nhập rõ ràng"
        description: "Là thành viên team, tôi muốn CLI báo lỗi rõ khi thiếu biến môi trường hoặc đăng nhập thất bại, để tự sửa được."
        acceptance_criteria:
          - "Thiếu biến môi trường thì CLI thoát exit 2 và nêu tên biến thiếu."
          - "Đăng nhập thất bại thì CLI thoát exit 5 và nêu URL Taiga, không nêu giá trị bí mật."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:feature]
      # Further Notes: việc của con người
      - key: SETUP-ROTATE-PASSWORD
        subject: "Đổi mật khẩu Taiga đã nằm literal trong cấu hình MCP"
        description: "Là trưởng nhóm, tôi muốn đổi mật khẩu Taiga đã từng nằm literal trong cấu hình MCP trên máy, để mật khẩu cũ không còn dùng được."
        acceptance_criteria:
          - "Mật khẩu cũ không đăng nhập được Taiga nữa."
          - "Biến môi trường TAIGA_PASSWORD trên các máy dùng repo đã đổi sang mật khẩu mới."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:chore]

  - key: CONV
    subject: "Quy ước Taiga chung"
    description: "Một tài liệu quy ước Taiga duy nhất cho người và agent, kèm lệnh taigent validate kiểm quy ước offline. Spec: https://github.com/sondoquang/taigent/issues/1"
    tags: [type:feature]
    stories:
      # US10
      - key: CONV-DOC
        subject: "Tài liệu quy ước Taiga duy nhất cho cả hai agent"
        description: "Là trưởng nhóm, tôi muốn một tài liệu quy ước Taiga duy nhất mà cả Claude Code lẫn Codex đều đọc qua AGENTS.md, để mọi người và mọi agent tạo dữ liệu theo cùng chuẩn."
        acceptance_criteria:
          - "docs/taiga/conventions.md là tài liệu quy ước duy nhất trong repo."
          - "AGENTS.md trỏ tới tài liệu quy ước và quy trình plan → review → apply; repo không có CLAUDE.md riêng."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:chore]
      # US11
      - key: CONV-NAMING
        subject: "Quy ước tên và slug project"
        description: "Là trưởng nhóm, tôi muốn quy ước quy định tên project dạng <Khách hàng/Mảng> - <Sản phẩm> và quy tắc slug, để danh sách project không còn lệch chuẩn."
        acceptance_criteria:
          - "Quy ước nêu dạng tên hai phần nối bằng ' - ' kèm ví dụ đúng và sai."
          - "Quy ước nêu cách Taiga sinh slug từ tên và việc thư mục manifest trùng slug."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:chore]
      # US12
      - key: CONV-TEMPLATE
        subject: "Quy ước chọn template và module bắt buộc"
        description: "Là trưởng nhóm, tôi muốn quy ước nói rõ loại dự án nào dùng scrum, loại nào dùng kanban, và module nào luôn bật, để mọi project mới có cấu trúc giống nhau."
        acceptance_criteria:
          - "Quy ước nêu khi nào chọn scrum và khi nào chọn kanban."
          - "Quy ước nêu Epics và Wiki luôn bật, kể cả khi template của instance để tắt."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:chore]
      # US13
      - key: CONV-TAGS
        subject: "Bộ tag có tiền tố và màu chuẩn"
        description: "Là trưởng nhóm, tôi muốn bộ tag có tiền tố cố định (type:, area:, src:) và màu chuẩn, để lọc và báo cáo được trên mọi project."
        acceptance_criteria:
          - "Quy ước liệt kê giá trị và màu chuẩn của từng tiền tố."
          - "Quy ước nêu src: chỉ do taigent gắn, manifest không được viết."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:chore]
      # US14
      - key: CONV-ITEM-TEMPLATE
        subject: "Mẫu mô tả story và task"
        description: "Là trưởng nhóm, tôi muốn mẫu mô tả story (user story, acceptance criteria, link spec) và mẫu task (định nghĩa done), để mọi item đọc lên giống nhau."
        acceptance_criteria:
          - "Quy ước có mẫu mô tả story gồm câu user story, acceptance criteria dạng checklist và link spec."
          - "Quy ước có mẫu mô tả task ghi định nghĩa done."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:chore]
      # US15
      - key: CONV-BANNED-MCP
        subject: "Danh sách tool MCP bị cấm"
        description: "Là trưởng nhóm, tôi muốn quy ước liệt kê các tool MCP bị cấm kèm lý do, để agent không gọi tool hỏng."
        acceptance_criteria:
          - "Quy ước liệt kê linkStoryToEpic, batchCreate* và download/delete attachment cho story/task kèm lý do hỏng."
          - "Không skill hay allowlist headless nào chứa tool bị cấm."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:chore]
      # US16
      - key: CONV-STATUS
        subject: "Ánh xạ status mặc định của template"
        description: "Là trưởng nhóm, tôi muốn quy ước ghi rõ ánh xạ status mặc định của template, để agent dùng đúng tên status."
        acceptance_criteria:
          - "Quy ước liệt kê đúng tên status theo thứ tự cho story, task và epic, kèm ý nghĩa."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:chore]
        tasks:
          - key: CONV-STATUS-VERIFY-EPIC
            subject: "Đối chiếu status epic trên instance"
            description: "Done khi: danh sách status epic trong quy ước đã được so với instance taiga.vidratek.net, và quy ước bỏ ghi chú chưa đối chiếu hoặc sửa theo instance."
      # US17
      - key: CONV-VALIDATE
        subject: "Lệnh taigent validate kiểm manifest offline"
        description: "Là thành viên team, tôi muốn lệnh taigent validate kiểm tra manifest theo quy ước mà không cần mạng, để phát hiện lệch chuẩn trước khi chạm Taiga."
        acceptance_criteria:
          - "validate kiểm tên, slug, tag, key trùng và field bắt buộc của mọi manifest."
          - "validate không cần biến TAIGA_* và không gọi Taiga."
          - "Manifest hợp lệ thì exit 0; sai thì exit 4 và in từng lỗi dạng file: path: message [rule]."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:feature]

  - key: BOOT
    subject: "Bootstrap project"
    description: "Tạo project chuẩn, hoặc đưa project cũ về chuẩn, từ project.yaml bằng một lệnh taigent bootstrap. Spec: https://github.com/sondoquang/taigent/issues/1"
    tags: [type:feature]
    stories:
      # US18
      - key: BOOT-MANIFEST
        subject: "Khai báo project trong project.yaml"
        description: "Là trưởng nhóm, tôi muốn khai báo project mới trong manifest project, để tạo project chỉ bằng một lệnh."
        acceptance_criteria:
          - "project.yaml khai báo được tên, slug, mô tả, template, private/public, module, tag kèm màu, custom attributes, thành viên kèm role và trang wiki Home."
          - "Field không có trong schema bị validate từ chối."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:feature]
      # US19
      - key: BOOT-CREATE
        subject: "Tạo project từ template đã khai báo"
        description: "Là trưởng nhóm, tôi muốn taigent bootstrap tạo project từ template đã khai báo, để project có đủ statuses, points và roles mặc định."
        acceptance_criteria:
          - "Bootstrap tạo project bằng POST /projects với creation_template lấy từ /project-templates theo tên."
          - "Template không có trên instance thì bootstrap từ chối với exit 5 và không ghi gì."
          - "Bootstrap không bao giờ tạo project template."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:feature]
      # US20
      - key: BOOT-MODULES
        subject: "Tự bật các module bắt buộc"
        description: "Là trưởng nhóm, tôi muốn bootstrap tự bật các module mà quy ước yêu cầu, đặc biệt Epics, để không ai phải bật tay."
        acceptance_criteria:
          - "Module có trong manifest mà đang tắt thì bootstrap bật nó."
          - "Module không có trong manifest thì giữ nguyên, không bị tắt."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:feature]
      # US21
      - key: BOOT-TAGS
        subject: "Tạo bộ tag chuẩn với màu chuẩn"
        description: "Là trưởng nhóm, tôi muốn bootstrap tạo đủ bộ tag chuẩn với màu chuẩn, để tag dùng được ngay khi tạo backlog."
        acceptance_criteria:
          - "Tag khai báo mà chưa có thì bootstrap tạo với màu chuẩn."
          - "Tag đã có nhưng khác màu thì bootstrap sửa về màu chuẩn."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:feature]
      # US22
      - key: BOOT-CUSTOM-ATTRS
        subject: "Tạo custom attributes cho epic, story và task"
        description: "Là trưởng nhóm, tôi muốn bootstrap tạo các custom attributes đã khai báo cho epic, story và task, để trường dữ liệu đồng nhất giữa các project."
        acceptance_criteria:
          - "Attribute khai báo mà chưa có tên đó trên loại item tương ứng thì bootstrap tạo với mô tả và kiểu đã khai báo."
          - "Attribute đã có cùng tên thì để nguyên."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:feature]
      # US23
      - key: BOOT-MEMBERS
        subject: "Mời thành viên theo role"
        description: "Là trưởng nhóm, tôi muốn bootstrap mời thành viên theo username hoặc email với role theo tên, để phân quyền đúng ngay từ đầu."
        acceptance_criteria:
          - "Thành viên chưa có trong project thì bootstrap mời với role tra theo tên hoặc slug."
          - "Role không có trong template/project thì bootstrap từ chối với exit 5 trước khi ghi."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:feature]
      # US24
      - key: BOOT-WIKI-HOME
        subject: "Tạo trang wiki Home"
        description: "Là trưởng nhóm, tôi muốn bootstrap tạo trang wiki Home từ nội dung đã khai báo, để project có điểm vào tài liệu."
        acceptance_criteria:
          - "Chưa có trang home thì bootstrap tạo từ wiki_home của manifest."
          - "Trang home đã có thì giữ nguyên."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:feature]
      # US25
      - key: BOOT-RERUN
        subject: "Chạy lại bootstrap chỉ bổ sung phần còn thiếu"
        description: "Là trưởng nhóm, tôi muốn chạy lại bootstrap trên project đã tồn tại chỉ bổ sung phần còn thiếu, để đưa project cũ về chuẩn mà không tạo project trùng."
        acceptance_criteria:
          - "Slug đã có thì bootstrap dùng project đó, không tạo project mới."
          - "Chạy bootstrap hai lần liên tiếp thì lần hai không có thay đổi và exit 0."
          - "Bootstrap không bao giờ tắt, đổi tên hay xoá gì."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:feature]
      # US26
      - key: BOOT-REFUSE
        subject: "Từ chối khi không có quyền admin"
        description: "Là trưởng nhóm, tôi muốn bootstrap từ chối kèm thông báo rõ khi slug thuộc một project mà tôi không có quyền admin, để không ghi nhầm."
        acceptance_criteria:
          - "Slug thuộc project mà người dùng không phải admin thì bootstrap thoát exit 5 và không ghi gì."
          - "Slug thuộc project private mà người dùng không thấy thì bootstrap từ chối, không tạo project slug-1."
          - "Taiga sinh slug khác manifest thì bootstrap dừng với exit 5 sau khi ghi slug thật vào state.json, và lần chạy sau không tạo project thứ hai."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:feature]
      # US27
      - key: BOOT-DRY-RUN
        subject: "Xem trước bootstrap bằng dry-run"
        description: "Là trưởng nhóm, tôi muốn bootstrap có chế độ dry-run liệt kê các thao tác sẽ làm, để duyệt trước khi tạo thật."
        acceptance_criteria:
          - "bootstrap --dry-run liệt kê mọi thao tác create/update, không ghi gì kể cả state.json."
          - "Có thay đổi thì exit 3, không có thì exit 0."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:feature]

  - key: PLAN
    subject: "Lập kế hoạch backlog"
    description: "Agent chuyển spec/PRD thành manifest backlog theo quy ước, chỉ ghi file, để người duyệt diff trước khi chạm Taiga. Spec: https://github.com/sondoquang/taigent/issues/1"
    tags: [type:feature]
    stories:
      # US28, US30
      - key: PLAN-FROM-SPEC
        subject: "Sinh manifest backlog từ spec"
        description: "Là PO, tôi muốn đưa cho agent một spec/PRD và nhận lại manifest backlog epic → story → task viết theo quy ước, để không phải tự chia nhỏ việc."
        acceptance_criteria:
          - "Skill taiga-plan-backlog đọc spec và ghi taiga/<slug>/backlog.yaml."
          - "Mỗi story có subject, mô tả theo mẫu, acceptance criteria và tag."
          - "Manifest sinh ra qua được taigent validate."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:feature]
      # US29
      - key: PLAN-KEYS
        subject: "Key ổn định, đọc được cho mọi item"
        description: "Là PO, tôi muốn mỗi epic, story và task có key ổn định, đọc được, để lần sau sửa spec thì agent cập nhật đúng item thay vì tạo mới."
        acceptance_criteria:
          - "Mọi item có key theo dạng chữ hoa, số và gạch ngang, duy nhất trong project."
          - "Key sai dạng hoặc trùng thì validate báo lỗi key-format hoặc key-unique."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:feature]
      # US31
      - key: PLAN-UPDATE-MANIFEST
        subject: "Cập nhật manifest hiện có khi spec đổi"
        description: "Là PO, tôi muốn agent cập nhật manifest hiện có khi spec thay đổi thay vì viết lại từ đầu, để diff git phản ánh đúng thay đổi."
        acceptance_criteria:
          - "Item cũ giữ nguyên key, vị trí và comment; chỉ dòng do spec đổi mới thay đổi."
          - "Item spec không còn nhắc tới được giữ lại và liệt kê trong báo cáo để người quyết định."
        spec: https://github.com/sondoquang/taigent/issues/1
        tags: [type:feature]
      # US32
      - key: PLAN-FILES-ONLY
        subject: "Lập kế hoạch chỉ ghi file, không chạm Taiga"
        description: "Là PO, tôi muốn bước lập kế hoạch chỉ ghi file và không ghi lên Taiga, để tôi duyệt diff manifest trước khi có gì thay đổi trên Taiga."
        acceptance_criteria:
          - "Skill taiga-plan-backlog không gọi lệnh hay tool MCP nào ghi lên Taiga."
        spec: https://github.com/sondoquang/taigent/issues/1
